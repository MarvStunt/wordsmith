name: GitHub Actions Wordsmith
on: [push]
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Install docker-compose
        run: sudo apt-get update && sudo apt-get install -y docker-compose
      - name: Build images
        run: docker compose build
      - name: Login to dockerhub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Tag all images
        run: |
          docker tag wordsmith-web:latest ${{ secrets.DOCKER_USERNAME }}/wordsmith:web
          docker tag wordsmith-words:latest ${{ secrets.DOCKER_USERNAME }}/wordsmith:words
          docker tag wordsmith-db:latest ${{ secrets.DOCKER_USERNAME }}/wordsmith:db
      - name: Push all images to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/wordsmith:web
          docker push ${{ secrets.DOCKER_USERNAME }}/wordsmith:words
          docker push ${{ secrets.DOCKER_USERNAME }}/wordsmith:db
