name: GitHub Actions Wordsmith
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push web
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/wordsmith:web
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push words
        uses: docker/build-push-action@v5
        with:
          context: ./words
          file: ./words/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/wordsmith:words
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push db
        uses: docker/build-push-action@v5
        with:
          context: ./db
          file: ./db/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/wordsmith:db
          cache-from: type=gha
          cache-to: type=gha,mode=max