name: GitHub Actions Wordsmith
on: [push]
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Install docker-compose
        run: sudo apt-get update && sudo apt-get install -y docker-compose
      - name: Build and launch Wordsmith instances
        run: sh ./launchInstances.sh 1
      - name: Login to dockerhub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Tag all images
        run: |
          INSTANCE_NAME="instance1"
          docker tag web_$INSTANCE_NAME:latest ${{ secrets.DOCKER_USERNAME }}/web_$INSTANCE_NAME:latest
          docker tag words_$INSTANCE_NAME:latest ${{ secrets.DOCKER_USERNAME }}/words_$INSTANCE_NAME:latest
          docker tag db_$INSTANCE_NAME:latest ${{ secrets.DOCKER_USERNAME }}/db_$INSTANCE_NAME:latest
      - name: Push all images to Docker Hub
        run: |
          INSTANCE_NAME="instance1"
          docker push ${{ secrets.DOCKER_USERNAME }}/web_$INSTANCE_NAME:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/words_$INSTANCE_NAME:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/db_$INSTANCE_NAME:latest
