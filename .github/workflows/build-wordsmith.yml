name: GitHub Actions Wordsmith
on: [push]
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Install docker-compose
        run: sudo apt-get update && sudo apt-get install -y docker-compose
      - name: Build and launch Wordsmith instances
        run: docker compose build
      - name: List all docker images
        run: docker images
      - name: Login to dockerhub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Tag all images
        run: |
          docker tag web:latest ${{ secrets.DOCKER_USERNAME }}/web:latest
          docker tag words:latest ${{ secrets.DOCKER_USERNAME }}/words:latest
          docker tag db:latest ${{ secrets.DOCKER_USERNAME }}/db:latest
      - name: Push all images to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/web:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/words:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/db:latest
